[pytest]
# Agrega la raíz del proyecto al PYTHONPATH para poder importar "pages" y "utils"
pythonpath = .

# URL base para las pruebas de UI (la usa Playwright al hacer page.goto("/..."))
base_url = https://www.saucedemo.com

# Opciones por defecto: salida detallada y traceback corto
addopts = -v --tb=short

# Marcadores para separar los tipos de prueba (pytest -m ui / pytest -m api)
markers =
    ui: pruebas de interfaz de usuario con Playwright
    api: pruebas de servicios REST con requests
